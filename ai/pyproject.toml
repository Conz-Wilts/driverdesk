[project]
name = "driverdesk-ai"
version = "0.0.0"
description = "DriverDesk AI pipeline: datasheet → description drafting and evaluation (P3, P6)."
readme = "README.md"
authors = [
    { name = "Conz-Wilts", email = "264718781+Conz-Wilts@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
