[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]
targets = [
  "thumbv8m.main-none-eabihf", # RP2350 (Pico 2)
  "thumbv6m-none-eabi",        # RP2040 fallback
  "wasm32-wasip2",             # logic modules (P7)
  "wasm32-unknown-unknown",
]
profile = "minimal"
