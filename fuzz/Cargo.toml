[package]
name = "dd-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dd-spec = { path = "../crates/dd-spec" }

# Not part of the main workspace: cargo-fuzz needs nightly.
[workspace]

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false
bench = false
